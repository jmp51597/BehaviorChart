<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>Behavior Chart</title>
  </head>
  <body>
    <!-- Shown on every screen once logged in -->
    <header id="app-header" hidden>
      <span id="whoami"></span>
      <button id="logout-btn">Log Out</button>
    </header>

    <!-- Login -->
    <section id="view-login" class="view" hidden>
      <h1>Behavior Chart</h1>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="signup-btn">Sign Up</button>
      <button id="login-btn">Log In</button>
      <p id="status"></p>
    </section>

    <!-- Teacher home: list of students -->
    <section id="view-teacher" class="view" hidden>
      <h2>My Students</h2>
      <div id="student-list"></div>
    </section>

    <!-- Parent home (built in Phase 7) -->
    <section id="view-parent" class="view" hidden>
      <h2>My Child</h2>
      <p>The parent view is coming in Phase 7.</p>
    </section>

    <!-- One student's chart for today -->
    <section id="view-chart" class="view" hidden>
      <button id="back-btn">&larr; Back to students</button>
      <h2 id="chart-title"></h2>
      <p id="chart-date"></p>
      <div id="chart-grid"></div>
      <p id="chart-total"></p>
      <p id="chart-error" class="error"></p>
    </section>

    <!-- Shown when an account has no users/{uid} doc -->
    <section id="view-norole" class="view" hidden>
      <h2>Account not set up</h2>
      <p>This account doesn't have a role yet. Ask a teacher to add you.</p>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
